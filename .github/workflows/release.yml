name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout tag/ref
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: 'pip'
          cache-dependency-path: 'tools/src/requirements-build.txt'

      - name: Install pinned PyMuPDF and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r tools/src/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean-build extract_assets.exe
        shell: pwsh
        run: ./tools/build_extractor.ps1

      - name: Verify full test suite (Windows PowerShell 5.1 + Python)
        shell: powershell
        run: ./tests/run_tests.ps1 -IncludePython

      - name: Verify full test suite (PowerShell 7)
        shell: pwsh
        run: ./tests/run_tests.ps1

      - name: Assemble luka-loop-win-x64.zip and SHA256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageParent = Join-Path $env:RUNNER_TEMP ('luka_pkg_' + [Guid]::NewGuid().ToString('N'))
          $stageDir = Join-Path $stageParent 'luka-loop'
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          foreach ($file in @('AGENTS.md', 'README.md', 'CHANGELOG.md', 'LICENSE', 'THIRD_PARTY_LICENSES.md')) {
            Copy-Item -LiteralPath $file -Destination (Join-Path $stageDir $file) -Force
          }
          foreach ($dir in @('.agents', 'input', 'licenses', 'tools')) {
            Copy-Item -LiteralPath $dir -Destination (Join-Path $stageDir $dir) -Recurse -Force
          }

          Get-ChildItem -LiteralPath $stageDir -Recurse -Force -Directory -Filter '__pycache__' | Remove-Item -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $stageDir 'tools\extract_assets\extract_assets.exe') -PathType Leaf)) {
            throw 'Missing extract_assets.exe in packaged staging directory.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stageDir '.agents\skills\pdf-to-html-vi\SKILL.md') -PathType Leaf)) {
            throw 'Missing .agents/skills in packaged staging directory.'
          }

          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $distDir = (Resolve-Path 'dist').Path
          $zipPath = Join-Path $distDir 'luka-loop-win-x64.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }

          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $stageParent,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          $zr = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $hasExe = $zr.Entries | Where-Object { $_.FullName -eq 'luka-loop/tools/extract_assets/extract_assets.exe' }
            $hasSkill = $zr.Entries | Where-Object { $_.FullName -eq 'luka-loop/.agents/skills/pdf-to-html-vi/SKILL.md' }
            if (-not $hasExe -or -not $hasSkill) {
              throw 'Packaged ZIP verification failed: missing extract_assets.exe or .agents/skills.'
            }
          } finally {
            $zr.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashContent = "$hash  luka-loop-win-x64.zip`n"
          [System.IO.File]::WriteAllText((Join-Path $distDir 'hashes.sha256'), $hashContent, (New-Object System.Text.UTF8Encoding($false)))

          $zipSize = (Get-Item -LiteralPath $zipPath).Length
          Write-Output ("Packaged {0} ({1:N0} bytes, sha256={2})" -f $zipPath, $zipSize, $hash)

      - name: Upload workflow artifact on manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: luka-loop-win-x64
          path: dist/
          retention-days: 7

      - name: Publish assets to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/luka-loop-win-x64.zip dist/hashes.sha256 --clobber
          } else {
            gh release create $tag dist/luka-loop-win-x64.zip dist/hashes.sha256 --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
