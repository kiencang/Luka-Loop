<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="20" y="24" font-size="14.5" font-weight="600" fill="#1a202c">Nhãn nằm giữa hình và chú thích: gom nhãn trước thì chú thích gần hơn</text>
  <text x="20" y="42" font-size="11.5" fill="#4a5568">Tune: 1.037 / 3.411 hình có chú thích (30%) có nhãn nằm trong dải này. Sơ đồ mô phỏng.</text>

  <!-- left: measured from visible part -->
  <text x="40" y="72" font-weight="600" fill="#1a202c">Đo từ phần nhìn thấy</text>
  <rect x="60" y="86" width="260" height="130" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <polyline points="72,200 122,170 172,182 222,130 272,142 310,100" fill="none" stroke="#2b6cb0" stroke-width="2"/>
  <g fill="#dd6b20" font-size="11"><text x="62" y="232">0</text><text x="120" y="232">20</text><text x="180" y="232">40</text><text x="240" y="232">60</text><text x="296" y="232">80</text></g>
  <text x="150" y="252" font-size="11.5" fill="#dd6b20">Thời gian (s)</text>
  <rect x="60" y="290" width="260" height="26" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="68" y="308" fill="#1a202c"><tspan font-weight="600">Figure 4:</tspan> ...</text>
  <line x1="340" y1="216" x2="340" y2="290" stroke="#4a5568"/><line x1="334" y1="216" x2="346" y2="216" stroke="#4a5568"/><line x1="334" y1="290" x2="346" y2="290" stroke="#4a5568"/>
  <text x="350" y="258" fill="#1a202c">trung vị 22,8 pt</text>
  <text x="350" y="274" fill="#4a5568">p99 77 pt</text>

  <!-- right: measured after taking labels -->
  <text x="520" y="72" font-weight="600" fill="#1a202c">Đo sau khi gom nhãn trong dải</text>
  <rect x="540" y="86" width="260" height="130" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <polyline points="552,200 602,170 652,182 702,130 752,142 790,100" fill="none" stroke="#2b6cb0" stroke-width="2"/>
  <g fill="#dd6b20" font-size="11"><text x="542" y="232">0</text><text x="600" y="232">20</text><text x="660" y="232">40</text><text x="720" y="232">60</text><text x="776" y="232">80</text></g>
  <text x="630" y="252" font-size="11.5" fill="#dd6b20">Thời gian (s)</text>
  <rect x="536" y="82" width="268" height="176" fill="none" stroke="#1a365d" stroke-width="2.2" stroke-dasharray="7 4"/>
  <rect x="540" y="290" width="260" height="26" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="548" y="308" fill="#1a202c"><tspan font-weight="600">Figure 4:</tspan> ...</text>
  <line x1="820" y1="258" x2="820" y2="290" stroke="#4a5568"/><line x1="814" y1="258" x2="826" y2="258" stroke="#4a5568"/><line x1="814" y1="290" x2="826" y2="290" stroke="#4a5568"/>
  <text x="830" y="270" fill="#1a202c">trung vị 15,7 pt</text>
  <text x="830" y="286" fill="#4a5568">p99 57 pt</text>

  <text x="20" y="340" font-size="12" fill="#1a202c">Với các hình có nhãn trong dải: khoảng cách rút ngắn trung vị 21 pt. 57 hình chuyển từ vùng 64–96 pt (phải có cầu nhãn) về ≤ 64 pt,</text>
  <text x="20" y="356" font-size="12" fill="#1a202c">3 hình từ ngoài vùng tìm (&gt; 96 pt) vào trong. Hiện nay ghép chú thích chạy trước lấy nhãn nên đo theo panel trái.</text>
</svg>
