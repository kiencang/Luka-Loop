    <rect x="660" y="244" width="16" height="16" fill="#c53030"/><rect x="678" y="259" width="16" height="1" fill="#feb2b2" stroke="#c53030"/>
    <rect x="730" y="196.7" width="16" height="63.3" fill="#2f855a"/><rect x="748" y="258.7" width="16" height="1.3" fill="#9ae6b4" stroke="#2f855a"/>
    <rect x="770" y="214.7" width="16" height="45.3" fill="#c53030"/><rect x="788" y="258.9" width="16" height="1.1" fill="#feb2b2" stroke="#c53030"/>
    <rect x="840" y="95.8" width="16" height="164.2" fill="#2f855a"/><rect x="858" y="256.7" width="16" height="3.3" fill="#9ae6b4" stroke="#2f855a"/>
    <rect x="880" y="63" width="16" height="197" fill="#c53030"/><rect x="898" y="256.6" width="16" height="3.4" fill="#feb2b2" stroke="#c53030"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#1a202c">
    <text x="628" y="246">11</text><text x="646" y="254">0,4</text><text x="668" y="240">18</text><text x="686" y="254">0,5</text>
    <text x="738" y="192">70</text><text x="756" y="253">1,4</text><text x="778" y="210">50</text><text x="796" y="253">1,2</text>
    <text x="848" y="91">182</text><text x="866" y="251">3,7</text><text x="888" y="59">219</text><text x="906" y="251">3,8</text>
  </g>
  <g font-size="11" fill="#4a5568" text-anchor="middle">
    <text x="657" y="276">≤ 8 pt</text><text x="767" y="276">≤ 16 pt</text><text x="877" y="276">≤ 30 pt</text>
    <text x="657" y="290" fill="#2b6cb0">nhãn 92,5%</text><text x="767" y="290" fill="#2b6cb0">97,9%</text><text x="877" y="290" fill="#2b6cb0">99,1%</text>
  </g>
  <g font-size="11.5">
    <rect x="600" y="306" width="12" height="12" fill="#2f855a"/><rect x="616" y="306" width="12" height="12" fill="#9ae6b4" stroke="#2f855a"/>
    <text x="634" y="316">Caption: mọi dòng / chỉ dòng đạt chuẩn nhãn</text>
    <rect x="600" y="324" width="12" height="12" fill="#c53030"/><rect x="616" y="324" width="12" height="12" fill="#feb2b2" stroke="#c53030"/>
    <text x="634" y="334">Text, List-item: mọi dòng / chỉ dòng đạt chuẩn nhãn</text>
    <text x="600" y="356" fill="#4a5568">Chuẩn nhãn = <tspan font-family="Consolas, monospace">_label_lines</tspan> hoặc khối là nhãn trục ngắn.</text>
    <text x="600" y="372" fill="#4a5568">Hàng xanh dương dưới trục: % nhãn đạt chuẩn lấy được.</text>
  </g>
</svg>
