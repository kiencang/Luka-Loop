<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="20" y="17" font-size="14.5" font-weight="600" fill="#1a202c">Nhãn nằm sát hình; khoảng cách một mình không đủ, chuẩn nhãn lọc gần hết chữ lạ</text>

  <!-- left chart: cumulative % within t -->
  <text x="80" y="35" font-size="11" fill="#4a5568">% dòng nằm trong khoảng cách t của phần nhìn thấy (tune)</text>
  <g stroke="#e2e8f0">
    <line x1="80" y1="40" x2="520" y2="40"/><line x1="80" y1="95" x2="520" y2="95"/><line x1="80" y1="150" x2="520" y2="150"/>
    <line x1="80" y1="205" x2="520" y2="205"/>
  </g>
  <line x1="80" y1="260" x2="520" y2="260" stroke="#2d3748"/><line x1="80" y1="40" x2="80" y2="260" stroke="#2d3748"/>
  <g font-size="11" fill="#4a5568" text-anchor="end">
    <text x="74" y="44">100%</text><text x="74" y="99">75%</text><text x="74" y="154">50%</text><text x="74" y="209">25%</text><text x="74" y="264">0</text>
  </g>
  <g font-size="11" fill="#4a5568" text-anchor="middle">
    <text x="80" y="276">0</text><text x="168" y="276">8</text><text x="256" y="276">16</text><text x="344" y="276">24</text>
    <text x="410" y="276">30</text><text x="520" y="276">40 pt</text>
  </g>
  <line x1="410" y1="40" x2="410" y2="260" stroke="#a0aec0" stroke-dasharray="3 3"/>
  <polyline fill="none" stroke="#2b6cb0" stroke-width="2.5" points="80,219.7 124,95.2 168,54.7 212,46.2 256,43.1 300,40.4 344,40.4 410,40.2 520,40.2"/>
  <polyline fill="none" stroke="#63b3ed" stroke-width="2" stroke-dasharray="6 3" points="80,224.6 124,118.1 168,80.3 212,67.1 256,58.5 300,51.7 344,47.3 388,44.8 410,44.0 520,41.3"/>
  <polyline fill="none" stroke="#2f855a" stroke-width="2" points="80,257.6 124,256.7 168,254.9 212,249.2 256,231.0 300,222.4 344,206.1 388,187.2 410,182.3 520,144.9"/>
  <polyline fill="none" stroke="#c53030" stroke-width="2" points="80,256.0 124,255.4 168,253.2 212,246.8 256,242.4 300,225.7 344,213.4 388,191.8 410,185.4 520,152.9"/>
  <g font-size="11.5">
    <rect x="100" y="296" width="16" height="3" fill="#2b6cb0"/><text x="122" y="301">nhãn, đo nối chuỗi qua nhãn khác (p99 17 pt)</text>
    <rect x="100" y="314" width="16" height="3" fill="#63b3ed"/><text x="122" y="319">nhãn, đo trực tiếp (p99 35 pt)</text>
    <rect x="100" y="332" width="16" height="3" fill="#2f855a"/><text x="122" y="337">dòng Caption gần hình</text>
    <rect x="100" y="350" width="16" height="3" fill="#c53030"/><text x="122" y="355">dòng Text gần hình</text>
  </g>
  <text x="416" y="200" font-size="11" fill="#4a5568">30 pt: 98% nhãn,</text>
  <text x="416" y="214" font-size="11" fill="#4a5568">nhưng cũng ~35% dòng</text>
  <text x="416" y="228" font-size="11" fill="#4a5568">Caption và Text</text>

  <!-- right chart: intruding lines per 100 figures -->
  <text x="600" y="35" font-size="11" fill="#4a5568">Dòng chữ lạ với tới được, trên 100 hình (nối chuỗi, tune)</text>
  <line x1="600" y1="260" x2="940" y2="260" stroke="#2d3748"/>
  <g>
