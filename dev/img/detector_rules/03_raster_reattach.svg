<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="20" y="26" font-size="14.5" font-weight="600" fill="#1a202c">Cơ chế 0: gắn lại nhãn đè lề (giai đoạn 2, <tspan font-family="Consolas, monospace">_reattach_overlaid_labels</tspan>)</text>

  <!-- page band markers -->
  <rect x="20" y="44" width="520" height="22" fill="#fff5f5"/>
  <text x="28" y="60" font-size="11.5" fill="#c53030">dải 10% đầu trang: không gắn</text>

  <!-- original box -->
  <rect x="60" y="80" width="420" height="230" fill="none" stroke="#718096" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="68" y="98" fill="#4a5568">khung gốc của ảnh</text>
  <!-- trimmed box -->
  <rect x="150" y="105" width="250" height="150" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <polyline points="160,240 210,200 260,215 310,150 360,170 395,120" fill="none" stroke="#2b6cb0" stroke-width="2"/>
  <text x="215" y="130" fill="#2b6cb0" font-weight="600">khung đã xén</text>

  <!-- labels -->
  <rect x="96" y="160" width="26" height="40" fill="#fefcbf" stroke="#2f855a" stroke-width="1.5"/>
  <text x="102" y="185" font-size="11" fill="#1a202c" transform="rotate(-90 109 180)">Lỗi</text>
  <text x="70" y="222" font-size="11" fill="#2f855a">✓ gắn</text>

  <rect x="230" y="282" width="90" height="18" fill="#fefcbf" stroke="#2f855a" stroke-width="1.5"/>
  <text x="240" y="295" font-size="11" fill="#1a202c">Thời gian (s)</text>
  <text x="330" y="295" font-size="11" fill="#2f855a">✓ gắn: cách 27 pt, vẫn trong khung gốc</text>

  <rect x="500" y="170" width="48" height="18" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="506" y="183" font-size="11" fill="#1a202c">nhãn B</text>
  <text x="556" y="176" font-size="11.5" fill="#c53030">✗ không gắn ở đây: ngoài khung gốc</text>
  <text x="556" y="192" font-size="11.5" fill="#c53030">dù chỉ cách khung gốc 20 pt</text>

  <!-- explanation -->
  <g font-size="12.5" fill="#1a202c">
    <text x="560" y="96" font-weight="600">Điều kiện để một khối chữ được gắn lại</text>
    <text x="560" y="116">• nằm trọn trong khung gốc, ngoài khung đã xén</text>
    <text x="560" y="134">• là nhãn trục ngắn (<tspan font-family="Consolas, monospace">_is_short_axis_label</tspan>)</text>
    <text x="560" y="152">• ngoài dải 10% đầu / 6% cuối, không phải đầu trang</text>
    <text x="560" y="222" font-weight="600">Không có giới hạn khoảng cách.</text>
    <text x="560" y="240">Thước đo là khung gốc, mà phần lớn</text>
    <text x="560" y="258">khoảng trắng trong đó là vô ý.</text>
    <text x="560" y="284" fill="#4a5568">"Nhãn B" chỉ còn trông vào cơ chế 1–5 ở giai đoạn 8,</text>
    <text x="560" y="302" fill="#4a5568">và các cơ chế đó bỏ qua ảnh raster không có chú thích.</text>
  </g>
  <text x="20" y="345" font-size="12" fill="#4a5568">Khung xanh nở ra bao lấy mọi khối được gắn (viền xanh lá). Mô phỏng, không theo tỷ lệ thật.</text>
</svg>
