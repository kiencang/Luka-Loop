<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="20" y="26" font-size="14.5" font-weight="600" fill="#1a202c">Lấy nhãn (giai đoạn 8): mỗi cơ chế với tới bao xa</text>
  <text x="20" y="44" font-size="11.5" fill="#4a5568">Tỷ lệ: 1 pt = 2 px. Khoảng cách đo từ khung hiện tại (phần nhìn thấy, sau gộp).</text>

  <!-- mechanism 2 zone (dashed orange): left 28, right 20, top 18, bottom 26 -->
  <rect x="64" y="104" width="336" height="232" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- mechanism 1 zone (blue): left/right/bottom 16, top 14 -->
  <rect x="88" y="112" width="304" height="204" fill="#e6fffa" stroke="#319795" stroke-width="1.5"/>
  <!-- figure -->
  <rect x="120" y="140" width="240" height="140" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <polyline points="130,270 180,230 230,245 280,190 330,205 352,160" fill="none" stroke="#2b6cb0" stroke-width="2"/>
  <text x="200" y="176" fill="#2b6cb0" font-weight="600">khung hiện tại</text>

  <g font-size="11" fill="#285e61">
    <text x="92" y="214">16</text><text x="364" y="214">16</text><text x="232" y="130">14</text><text x="232" y="302">16</text>
  </g>
  <g font-size="11" fill="#c05621">
    <text x="66" y="236">28</text><text x="380" y="236">20</text><text x="262" y="120">18</text><text x="262" y="330">26</text>
  </g>

  <g fill="#1a202c">
    <rect x="20" y="356" width="14" height="12" fill="#e6fffa" stroke="#319795"/>
    <text x="40" y="367"><tspan font-weight="600">Cơ chế 1</tspan> nhãn trục: lấy cả <tspan font-style="italic">khối</tspan>; nở tối đa trái 52, phải 40, dưới 36, trên 24 pt</text>
    <rect x="20" y="380" width="14" height="12" fill="#fffaf0" stroke="#dd6b20" stroke-dasharray="3 2"/>
    <text x="40" y="391"><tspan font-weight="600">Cơ chế 2</tspan> dòng nhãn: lấy từng <tspan font-style="italic">dòng</tspan>; nở tối đa 60 pt mỗi phía</text>
  </g>

  <!-- right panel: mechanisms 3 and 4 -->
  <text x="520" y="76" font-weight="600" fill="#1a202c">Cơ chế 3: nhãn ở đầu nét kẻ mảnh</text>
  <rect x="520" y="90" width="200" height="120" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <circle cx="640" cy="140" r="16" fill="#bee3f8" stroke="#2b6cb0"/>
  <line x1="652" y1="130" x2="800" y2="104" stroke="#2d3748" stroke-width="1"/>
  <rect x="804" y="94" width="78" height="18" fill="#fefcbf" stroke="#2f855a" stroke-width="1.5"/>
  <text x="810" y="107" font-size="11">tế bào gốc</text>
  <text x="730" y="150" font-size="11.5" fill="#4a5568">nét ≤ 1 pt, dài 5 pt … 40% trang,</text>
  <text x="730" y="166" font-size="11.5" fill="#4a5568">chạy ra từ trong khung; đầu nét</text>
  <text x="730" y="182" font-size="11.5" fill="#4a5568">cách chữ ≤ 6 pt; nở tới 100 pt</text>

  <text x="520" y="250" font-weight="600" fill="#1a202c">Cơ chế 4: số trục vẽ bằng ảnh từng ký tự</text>
  <rect x="580" y="264" width="200" height="80" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <g fill="#fbd38d" stroke="#c05621">
    <rect x="566" y="268" width="9" height="11"/><rect x="566" y="298" width="9" height="11"/><rect x="566" y="328" width="9" height="11"/>
    <rect x="600" y="350" width="9" height="11"/><rect x="660" y="350" width="9" height="11"/><rect x="720" y="350" width="9" height="11"/>
  </g>
  <text x="790" y="290" font-size="11.5" fill="#4a5568">ảnh nhỏ (cạnh ≤ 12 pt)</text>
  <text x="790" y="306" font-size="11.5" fill="#4a5568">cách khung ≤ 8 pt,</text>
  <text x="790" y="322" font-size="11.5" fill="#4a5568">không nối chuỗi</text>

  <text x="520" y="392" font-size="12" fill="#1a202c">Cả 4 cơ chế dừng ở: chú thích, hình khác, văn bản chính, mép cột.</text>
  <text x="520" y="410" font-size="12" fill="#c53030">Ảnh raster không có chú thích: bỏ qua cả 4 cơ chế.</text>
</svg>
